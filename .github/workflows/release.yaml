name: release
on:
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release_build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # for creation times of pages
          lfs: true
      - uses: $/.github/actions/setup
      - uses: actions/configure-pages@v6.0.0
      - run: node --run build
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: doc/dist
      - uses: actions/deploy-pages@v5.0.1
        if: github.ref == 'refs/heads/main'
  release_test:
    needs:
      - release_build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          lfs: true
      - uses: $/.github/actions/setup
      - uses: raviqqe/muffy@v0.5.9
  release:
    needs:
      - release_build
      - release_test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: for result in ${{ join(needs.*.result, ' ') }}; do [ $result = success ]; done
