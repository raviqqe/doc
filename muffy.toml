[cache]
persistent = true

[sites.default]
roots = []
max_redirects = 8
schemes = ["https"]
statuses = [200]
timeout = "30s"

[sites.default.cache]
max_age = "1w"
stale_while_revalidate = "1w"

[sites.default.headers]
user-agent = "Muffy"

[sites.default.retry]
count = 3
factor = 2
interval = { initial = "500ms", cap = "10s" }
statuses = [408, 500, 502, 503, 504]

[sites.main]
extend = "default"
roots = ["https://raviqqe.com/doc"]
recurse = true

[sites.main.validation.html]
ignored_attributes = ["data-.*"]
ignored_elements = [
  "astro-island",
  "site-search",
  # TODO Allow inlined SVG elements.
  "circle",
  "foreignObject",
  "path",
  "picture",
  "svg",
]

[sites.main.validation.svg]
ignored_attributes = ["data-.*"]
# TODO Fix flow elements nested in phrasing elements generated by Mermaid.
ignored_elements = ["p"]

[sites.crates_io]
extend = "default"
roots = ["https://crates.io/"]
statuses = [200, 403, 404]

[sites.github]
extend = "default"
roots = ["https://github.com/"]
concurrency = 64
fragments_ignored = true

[sites.github.rate_limit]
supply = 10
window = "1s"

[sites.algo_logic]
extend = "default"
roots = ["https://algo-logic.info/"]
fragments_ignored = true

[sites.semantic_scholar]
extend = "default"
roots = ["https://infoscience.epfl.ch/", "https://www.semanticscholar.org/"]
statuses = [200, 202]

[sites.zulip]
extend = "default"
roots = ["https://prog-lang-sys-ja.zulipchat.com/"]
fragments_ignored = true

[sites.flaky]
extend = "default"
roots = ["https://gitlab.haskell.org/"]

[sites.flaky.retry]
count = 5

[sites.forbidden]
extend = "default"
roots = [
  "https://dl.acm.org/",
  "https://en.wikipedia.org/wiki/",
  "https://jcsites.juniata.edu/",
  "https://lisp.conpass.com/",
  "https://mojolang.org/",
  "https://qiita.com/",
  "https://www.npmjs.com/",
  "https://www.oreilly.com/",
  "https://www.researchgate.net/",
]
statuses = [200, 403]

[sites.rate_limited]
extend = "default"
roots = ["https://www.lambdanote.com/", "https://www.youtube.com/"]
statuses = [200, 429]
